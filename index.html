<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KARIN SCHNEIDER // THE IMAGE MACHINE</title>
    <style>
        :root { --bg: #ffffff; --text: #000000; --accent: #666666; --border: #dddddd; }
        body.dark-mode { --bg: #000000; --text: #ffffff; --accent: #999999; --border: #333333; }
        
        body { 
            background-color: var(--bg); color: var(--text); 
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; 
            margin: 0; padding: 0; overflow: hidden; height: 100vh; position: relative;
            transition: background-color 0.2s, color 0.2s;
        }
        
        /* Interactive Structural Matrix Grid */
        #grid-matrix { 
            display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(12, 1fr); 
            width: 100vw; height: 100vh; padding: 20px; gap: 15px; 
        }
        
        .block { 
            border: 2px solid var(--text); position: relative; 
            display: flex; flex-direction: column; justify-content: flex-end; 
            padding: 15px; cursor: pointer; overflow: hidden; background: var(--bg);
            transition: border-color 0.2s;
        }
        .block:hover { border-color: var(--accent); }
        
        /* The Actual Visual Assets Mapping into the Vault */
        .asset-img { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; opacity: 0.85; transition: opacity 0.2s; 
        }
        .block:hover .asset-img { opacity: 1; }
        
        /* String Label Output: YEAR_MODE_SUBCATEGORY_TITLE_LOCATION */
        .identity-label { 
            position: relative; font-size: 11px; font-weight: bold; 
            letter-spacing: -0.01em; background: var(--bg); color: var(--text);
            padding: 4px 8px; display: inline-block; max-width: 100%;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            opacity: 0; transition: opacity 0.2s; border: 1px solid var(--text);
        }
        .block:hover .identity-label { opacity: 1; }

        /* Ledger Tracks */
        #ledger { position: absolute; top: 30px; left: 30px; font-family: monospace; font-size: 10px; color: var(--accent); pointer-events: none; z-index: 10; line-height: 1.5; }

        /* Single Floating Circle Module */
        #orbital-lens { 
            position: fixed; width: 40px; height: 40px; background: var(--text); 
            border-radius: 50%; pointer-events: none; z-index: 100; 
            transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s; 
            mix-blend-mode: difference; 
        }
    </style>
</head>
<body class="dark-mode"> <div id="ledger">[SYSTEM INITIALIZED] // REPOSITORY DATA ACTIVE</div>
    <div id="grid-matrix"></div>
    <div id="orbital-lens"></div>

    <script>
        const matrixContainer = document.getElementById('grid-matrix');
        const lens = document.getElementById('orbital-lens');
        const ledger = document.getElementById('ledger');

        // Capture Mouse Movements for the Floating Circle
        window.addEventListener('mousemove', (e) => {
            lens.style.left = e.clientX + 'px';
            lens.style.top = e.clientY + 'px';
        });

        async function loadRepository() {
            // Read directly from your existing data footprint source
            const response = await fetch('data.vcs');
            const csvText = await response.text();
            const lines = csvText.trim().split('\n').slice(1);

            const database = lines.map(line => {
                const cols = line.split(',');
                return {
                    year: (cols[0] || "").trim(),
                    mode: (cols[1] || "").trim(),
                    entry: (cols[2] || "").trim(),
                    context: (cols[3] || "").trim(),
                    venue: (cols[4] || "").trim(),
                    location: (cols[5] || "").trim()
                };
            });

            // Map and spawn the layout blocks using asymmetrical grid spans
            const gridLayouts = [
                {col: "span 4", row: "span 5"}, {col: "span 5", row: "span 4"},
                {col: "span 3", row: "span 6"}, {col: "span 5", row: "span 5"},
                {col: "span 4", row: "span 3"}, {col: "span 3", row: "span 4"},
                {col: "span 4", row: "span 6"}, {col: "span 5", row: "span 3"}
            ];

            matrixContainer.innerHTML = database.slice(0, 8).map((item, idx) => {
                const layout = gridLayouts[idx % gridLayouts.length];
                
                // Formulate the definitive, clean string match variable
                const cleanTitle = item.entry.replace(/[^a-zA-Z0-9]/g, "-");
                const cleanVenue = item.venue.replace(/[^a-zA-Z0-9]/g, "-");
                const identityString = `${item.year}_${item.mode.toUpperCase()}_${cleanTitle}_${cleanVenue}`;
                
                // Points directly to images inside an images folder named after your titles
                const imagePath = `images/${item.year}_${item.mode.toLowerCase()}.jpg`;

                return `
                    <div class="block" style="grid-column: ${layout.col}; grid-row: ${layout.row};" onclick="mutateSystem()">
                        <img src="${imagePath}" class="asset-img" onerror="this.style.display='none';">
                        <div class="identity-label">${identityString}</div>
                    </div>
                `;
            }).join('');

            attachBlockInteractions();
        }

        function attachBlockInteractions() {
            document.querySelectorAll('.block').forEach(block => {
                block.addEventListener('mouseenter', () => {
                    lens.style.width = '65px';
                    lens.style.height = '65px';
                    const stringText = block.querySelector('.identity-label').innerText;
                    logTrack('HUMAN_FOCUS', `INDEX DATA READ: ${stringText}`);
                });
                block.addEventListener('mouseleave', () => {
                    lens.style.width = '40px';
                    lens.style.height = '40px';
                });
            });
        }

        function mutateSystem() {
            // Scramble the visual constellation placements instantly upon clicking
            for (let i = matrixContainer.children.length; i >= 0; i--) {
                matrixContainer.appendChild(matrixContainer.children[Math.random() * i | 0]);
            }
            logTrack('SYSTEM_MUTATION', 'COORDINATE CODES RE-ALIGNED');
        }

        function logTrack(agent, detail) {
            const time = new Date().toLocaleTimeString();
            ledger.innerHTML = `[${time}] // ${agent} // ${detail}`;
        }

        // Simulate Background Crawler Traffic detection to flag interaction differences
        setInterval(() => {
            if(Math.random() > 0.7) {
                const time = new Date().toLocaleTimeString();
                ledger.innerHTML = `[${time}] // AI_CRAWL_DETECTED // INDEX_SCRAMBLE // COORDINATES ALTERED`;
                mutateSystem();
            }
        }, 9000);

        loadRepository();
    </script>
</body>
</html>
